image: lorisleiva/laravel-docker:7.4

.init_ssh: &init_ssh |
  eval $(ssh-agent -s)
  echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
  mkdir -p ~/.ssh
  chmod 700 ~/.ssh
  ssh-keyscan -H "$DEPLOYMENT_HOST" >> ~/.ssh/known_hosts
  chmod 644 ~/.ssh/known_hosts

.change_file_permissions: &change_file_permissions |
  find . -type f -not -path "./vendor/*" -exec chmod 664 {} \;
  find . -type d -not -path "./vendor/*" -exec chmod 775 {} \;

include:
  - template: Dependency-Scanning.gitlab-ci.yml
  - template: Security/License-Scanning.gitlab-ci.yml

composer:
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-composer
    paths:
      - vendor/
      - database/database.sqlite
  script:
    - php -v
    - composer -V
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
    - cp .env.example .env
    - php -r "new SQLite3('database/database.sqlite');"
    - php artisan key:generate
    - php artisan migrate:fresh
  artifacts:
    expire_in: 1 month
    paths:
      - vendor/
      - .env
      - database/database.sqlite

npm:
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-npm
    paths:
      - node_modules/
  before_script:
    - apk add --update --no-cache python3
  script:
    - npm --version
    - npm install
    - npm run prod
  artifacts:
    expire_in: 1 month
    paths:
      - node_modules/
      - public/css/
      - public/js/
      - public/fonts/
      - public/mix-manifest.json

phpunit:
  stage: test
  dependencies:
    - composer
    - npm
  before_script:
    - apk add chromium-chromedriver
    - apk add chromium
  script:
    - chromedriver 2>&1 &
    - sleep 5
    - nohup php artisan serve &
    - phpunit --coverage-text --colors=never --stderr
  artifacts:
    paths:
      - storage/logs
      - tests/Browser/screenshots
      - tests/Browser/console
    expire_in: 1 month
    when: on_failure

phpcpd:
  stage: test
  script:
    - test -f phpcpd.phar || curl -L https://phar.phpunit.de/phpcpd.phar -o phpcpd.phar
    - php phpcpd.phar app/ --min-lines=50
  dependencies: []
  needs: []
  cache:
    key: ${CI_COMMIT_REF_SLUG}-phpcpd
    paths:
      - phpcpd.phar

phpcs:
  stage: test
  dependencies:
    - composer
  script:
    - composer style-test

sensiolabs:
  stage: test
  script:
    - test -d security-checker || git clone https://github.com/sensiolabs/security-checker.git
    - cd security-checker
    - php security-checker security:check ../composer.lock
  dependencies:
    - composer
  cache:
    key: ${CI_COMMIT_REF_SLUG}-sensiolabs
    paths:
      - security-checker

deployer:
  stage: deploy
  dependencies:
    - composer
    - npm
  script:
    - *init_ssh
    - *change_file_permissions
    - echo "DEPLOYER_DEFAULT_HOST=$DEPLOYMENT_HOST" >> .env
    - php artisan deploy -s upload
  environment:
    name: production
    url: http://musikalische-loewen.de
  only:
    - master
