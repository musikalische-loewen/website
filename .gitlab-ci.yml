stages:
  - building
  - testing

image: lorisleiva/laravel-docker:7.4

before_script:
  - apk add chromium-chromedriver -y
  - apk add chromium -y

composer:
  stage: building
  cache:
    key: ${CI_COMMIT_REF_SLUG}-composer
    paths:
      - vendor/
      - database/database.sqlite
  script:
    - php -v
    - composer -V
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
    - cp .env.testing .env
    - php -r "new SQLite3('database/database.sqlite');"
    - php artisan key:generate
    - php artisan migrate:fresh
  artifacts:
    expire_in: 1 month
    paths:
      - vendor/
      - .env
      - database/database.sqlite

npm:
  stage: building
  cache:
    key: ${CI_COMMIT_REF_SLUG}-npm
    paths:
      - node_modules/
  script:
    - npm --version
    - npm install
    - npm run prod
  artifacts:
    expire_in: 1 month
    paths:
      - node_modules/
      - public/css/
      - public/js/
      - public/fonts/
      - public/mix-manifest.json

phpunit:
  stage: testing
  dependencies:
    - composer
  script:
    - chromedriver 2>&1 &
    - sleep 5
    - nohup php artisan serve &
    - phpunit --coverage-text --colors=never --stderr
  artifacts:
    paths:
      - /storage/logs
      - /tests/Browser/screenshots
      - /tests/Browser/console
    expire_in: 1 month
    when: on_failure

phpcpd:
  stage: testing
  script:
    - test -f phpcpd.phar || curl -L https://phar.phpunit.de/phpcpd.phar -o phpcpd.phar
    - php phpcpd.phar app/ --min-lines=50
  dependencies: []
  cache:
    key: ${CI_COMMIT_REF_SLUG}-phpcpd
    paths:
      - phpcpd.phar

phpcs:
  stage: testing
  dependencies: []
  script:
    - phpcs --standard=PSR2 --extensions=php --ignore=app/Support/helpers.php app

sensiolabs:
  stage: testing
  script:
    - test -d security-checker || git clone https://github.com/sensiolabs/security-checker.git
    - cd security-checker
    - php security-checker security:check ../composer.lock
  dependencies:
    - composer
  cache:
    key: ${CI_COMMIT_REF_SLUG}-sensiolabs
    paths:
      - security-checker
